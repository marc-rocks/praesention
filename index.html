<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Social Media Campus</title>
<meta name="description" content="Lernportal für Social Media Marketing mit Lektionen, Praxisbeispielen und Multiple-Choice-Quiz.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#start" id="brand-link">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">Social Media Campus</span>
    </a>
    <div class="topbar-progress" id="topbar-progress" aria-label="Gesamtfortschritt">
      <span class="topbar-progress-label" id="topbar-progress-label">0 von 8 Modulen</span>
      <span class="topbar-progress-track"><span class="topbar-progress-fill" id="topbar-progress-fill"></span></span>
    </div>
  </div>
</header>

<div class="shell">
  <nav class="sidenav" id="sidenav" aria-label="Module"></nav>
  <main class="content" id="content" tabindex="-1"></main>
</div>

<footer class="footer">
  <div class="footer-inner">
    <p>Dieses Lernportal fasst gängige Praxis im Social-Media-Marketing zusammen. Die Angaben zu Recht und Kennzeichnung sind eine Orientierung für Deutschland und ersetzen keine Rechtsberatung. Dein Fortschritt wird nur in diesem Browser gespeichert.</p>
    <button class="link-button" id="reset-progress" type="button">Fortschritt zurücksetzen</button>
  </div>
</footer>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
